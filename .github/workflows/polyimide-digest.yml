name: Polyimide digest

on:
  schedule:
    - cron: "17 21 * * *" # 매일 06:17 KST
  workflow_dispatch:
    inputs:
      days:
        description: "수집 기간(일). 비우면 config.json 값 사용"
        required: false

permissions:
  contents: write

concurrency:
  group: polyimide-digest
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect news and literature
        env:
          DAYS: ${{ inputs.days }}
        run: python3 polyimide/collect.py ${DAYS:+--days "$DAYS"}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add polyimide/data.json polyimide/digest.md
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "Update polyimide digest $(date -u +%Y-%m-%d)"
          git push
